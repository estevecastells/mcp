id: invokely-mcp-connector
name: Invokely MCP Connector
description: >-
  Invokely exposes official statistics through a hosted MCP service. This entry is for the MIT-licensed
  local stdio connector, which forwards MCP tool discovery and calls to that service unchanged; its public
  repository does not contain the hosted backend, so the tool list below reflects the hosted service on
  the date in updated_at and can change independently of the connector. Without INVOKELY_API_KEY the connector
  uses the trial endpoint, limited to 25 calls per day per IP. Requires Node.js 22 or later.


  Statistics tools (read-only, usable on the trial endpoint): find indicators, resolve places, return
  cited values and time series, compare and rank places, check claims, list revisions, place profiles
  and the release calendar. Returned figures include their period, unit, publisher, source link and citation.


  Account tools are listed by the trial endpoint but need an authenticated account (API key), and some
  a specific plan. Write operations: workspace_save, workspace_update and workspace_delete (Pro plan),
  subscribe_alert, update_alert and delete_alert, save_to_collection, and send_feedback (also allowed
  without an account, rate limited). workspace_delete and delete_alert are destructive and cannot be undone.
  The connector does not restrict which tools a client can call.
author:
  name: Esteve Castells
  github: estevecastells
repository: https://github.com/estevecastells/invokely-mcp-connector
transport:
- stdio
category: Research
tags:
- official-statistics
- public-data
- statistics
- data-api
- mcp-connector
created_at: '2026-10-12T00:00:00.000Z'
updated_at: '2026-11-09T00:00:00.000Z'
tools:
- name: search_indicators
  description: Find official statistical indicators by natural language (English or Spanish), optionally
    limited to a geography. Read-only; works on the trial endpoint.
  input_schema:
    type: object
    properties:
      query:
        type: string
        minLength: 1
        maxLength: 300
        description: What you are looking for, for example "inflation", "paro registrado", "average income
          per person".
      geography:
        type: string
        minLength: 1
        maxLength: 200
        description: Optional place the data is for. Same format as place in the other tools.
    required:
    - query
    additionalProperties: false
- name: resolve_place
  description: Resolve a place name or code to the normalized entity Invokely uses, with official codes
    (INE, NUTS, ISO, FIPS), level and parent. Read-only.
  input_schema:
    type: object
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 200
        description: 'Place name or id. Examples: "Mataró", "Barcelona", "provincia de Barcelona", "Cataluña",
          "España", "Germany", "EU", "es-mun-08121", "08121" (INE code), "ES51" (NUTS), "Texas", "Travis
          County, Texas", "us-county-48453", "fips:48453" (US county FIPS), "Austin, TX", "us-place-4805000",
          "fips:4805000" (US city GEOID).'
      country:
        type: string
        maxLength: 2
        description: Optional ISO 3166-1 alpha-2 code to disambiguate the place, for example "ES" or "US".
      level:
        type: string
        enum:
        - municipality
        - province
        - region
        - country
        - supranational
        description: Optional preferred level.
    required:
    - name
    additionalProperties: false
- name: get_value
  description: 'Get one official figure for an indicator and place: the latest or a given period, optionally
    transformed (growth, per capita, real terms) or as it was known at an earlier date (as_of). Returns
    period, unit and source citation. Read-only.'
  input_schema:
    type: object
    properties:
      indicator:
        type: string
        minLength: 1
        maxLength: 100
        description: Indicator id from search_indicators, for example "population", "registered_unemployment_rate",
          "unemployment_rate", "cpi_annual_change", "net_income_per_person".
      place:
        type: string
        minLength: 1
        maxLength: 200
        description: 'Place name or id. Examples: "Mataró", "Barcelona", "provincia de Barcelona", "Cataluña",
          "España", "Germany", "EU", "es-mun-08121", "08121" (INE code), "ES51" (NUTS), "Texas", "Travis
          County, Texas", "us-county-48453", "fips:48453" (US county FIPS), "Austin, TX", "us-place-4805000",
          "fips:4805000" (US city GEOID).'
      period:
        type: string
        maxLength: 10
        description: Optional. "2024" (year), "2024-Q3" (quarter), "2024-S1" (half year) or "2024-09"
          (month). Omit for the latest value.
      frequency:
        type: string
        enum:
        - year
        - half
        - quarter
        - month
        description: Optional. Force a frequency when the indicator exists in several (for example monthly
          and annual unemployment).
      country:
        type: string
        maxLength: 2
        description: Optional ISO 3166-1 alpha-2 code to disambiguate the place, for example "ES" or "US".
      transform:
        type: string
        enum:
        - pct_change
        - yoy
        - diff
        - yoy_diff
        - index
        - rolling_mean
        - per_capita
        - per_1000
        - per_100k
        - real
        - share_of_parent
        description: 'Optional calculation done by the server, with every input cited. pct_change: % change
          from the previous period. yoy: % change from the same period a year earlier (12 months, 4 quarters
          or 1 year back). diff, yoy_diff: the same changes as differences, in the indicator unit (percentage
          points for rates). index: value / value in base x 100 (needs base). rolling_mean: average of
          the last window periods. per_capita, per_1000, per_100k: a total (population, births, GDP, emissions)
          divided by the population of the same place and year. real: a money amount at current prices
          adjusted for inflation with the consumer price index of the place''s country in the same currency
          (base: price year, default the latest complete year). share_of_parent: a total as % of the parent
          place (county of its state, state of the nation, region of its country). Per person and share
          transforms refuse rates, shares, indices, medians and per person values, and share_of_parent
          also refuses net balances such as net migration; pct_change, yoy and index refuse percentages.'
      base:
        type: string
        maxLength: 10
        description: 'index: the period equal to 100, for example "2015" or "2020-01" (a year of a monthly
          series is the average of its months). real: the year whose prices values are expressed in, for
          example "2024".'
      window:
        type: integer
        minimum: 2
        maximum: 12
        description: 'rolling_mean only: number of periods averaged, 2 to 12. Default 3.'
      citation_style:
        type: string
        enum:
        - apa
        - mla
        - chicago
        - harvard
        - bibtex
        - ris
        - all
        description: Optional. Adds source.citations with the citation in this style (APA 7, MLA 9, Chicago
          author-date, Harvard, BibTeX or RIS), or in all six with "all". The publisher is the author.
          Leave it out to keep the response short.
      as_of:
        type: string
        maxLength: 32
        description: 'Optional point in time, UTC: a date ("2026-10-03", meaning the end of that day)
          or a date and time with a zone ("2026-10-03T14:30:00Z"). Returns the figures as Invokely held
          them at that instant, for backtests, audits and reproducible runs. Must not be in the future.'
    required:
    - indicator
    - place
    additionalProperties: false
